[env:readpico]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
extra_scripts =
  ${base.extra_scripts}
  pre:scripts/build_readpico_ui.py
lib_deps =
  ${base.lib_deps}
  ReadPicoHardware=symlink://freeink-sdk/libs/hardware/ReadPicoHardware
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_READPICO=1
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DUSB_PRODUCT=\"CrossPoint_Read_Pico\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-readpico-dev\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
